id: GQ-T022
slug: south-asia-monsoon
title: 气候与农业
summary: 在原创季节情景中对照降雨时机、播期、作物与有限补灌，用水量账和低温暴露解释方案取舍。
coreQuestion: 总雨量相同，为什么农业供水条件仍可能不同？
volume: G7B
chapter: 气候与农业区位
prototype: compare
channels: [earth-lab, region-explorer, textbook-explorer]
competencies: [综合思维, 人地协调观, 地理实践力]
status: 已发布
releaseBatch: Sprint 2
classroomMinutes: 20
explorationMinutes: 20
modes:
  exploration: { path: /topics/south-asia-monsoon }
  classroom: { query: "?mode=classroom", sameContent: true }
primaryInteraction:
  object: 同坐标雨热图与逐日根区水量模型
  action: 先比较雨季时序，再分别改变播期、作物或补灌预算
  feedback: 早期缺口、整季缺口、实际净补灌与低温暴露同步更新
evidenceOutput:
  type: 对比表
  description: 保存完整条件和180天水量记录，检查单变量对照并导出JSON
  persistsFreeText: false
reflectionPrompt: 为什么需水少或缺口小不能直接推出产量高、收益好？
hints: [比较降雨时序时保持作物播期补灌相同, 比较应对方案时只改变一项, 同时检查低温与水量]
components: [FarmChart, FarmWaterBalance, FarmEvidence]
sources:
  - kind: reference
    id: DS-FAO-CROP-WATER
    title: Crop water and irrigation water requirements
    publisher: FAO AQUASTAT
    attribution: FAO
    url: https://www.fao.org/aquastat/en/data-analysis/irrig-water-use/irrig-water-requirement/
    verifiedAt: "2026-09-19"
    review: &sourceReview { status: initial, notes: 核对需水与有效降雨原理，未复制图像或引用为系数校准 }
  - kind: reference
    id: DS-FAO-EFFECTIVE-RAIN
    title: Irrigation water needs
    publisher: FAO
    attribution: FAO
    url: https://www.fao.org/4/s2022e/s2022e08.htm
    verifiedAt: "2026-09-19"
    review: *sourceReview
  - kind: simulation
    id: DS-SIM-FARM-GQ
    title: GeoQuest 原创季节供水情景
    attribution: GeoQuest 原创
    method: 完整雨型平移保持总量，按天核算根区储水、需求、有限净补灌及缺口
    parameters: [180天总雨量320毫米, 根区初存20毫米上限60毫米, 80百分比雨量入根区, 玉米谷子示意方案, 15摄氏度教学阈值]
    version: 2.0.0
    limitations: [不是任何地区的观测或气候平均值, 所有系数为未校准教学假设, 不预测产量收益或气候变化, 不模拟非生长期蒸发和地下水]
    review: *sourceReview
