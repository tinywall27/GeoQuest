id: GQ-T006
slug: contour-rescue
title: 地形与路线探究
summary: 旋转三维山地，对照同源等高线与路线剖面，用距离、爬升和坡度证据比较三条路线。
coreQuestion: 直达的路线一定更省力吗，等高线与剖面能提供哪些证据？
volume: G7A
chapter: 学会使用地图
prototype: geo-challenge
channels: [map-lab, geo-challenge, textbook-explorer]
competencies: [区域认知, 地理实践力]
status: 已发布
releaseBatch: Sprint 1
classroomMinutes: 20
explorationMinutes: 20
modes:
  exploration: { path: /topics/contour-rescue }
  classroom: { query: "?mode=classroom", sameContent: true }
primaryInteraction:
  object: 同源三维高程表面与等高线
  action: 旋转俯视与切片观察，比较三条同起终点路线
  feedback: 三维和二维观察点、剖面及距离爬升坡度同步更新
evidenceOutput:
  type: 路线
  description: 多条路线的水平距离、累计爬升与最大局部坡度对照表，可导出CSV
  persistsFreeText: false
reflectionPrompt: 为什么等高线证据不能单独保证现实中的救援安全？
hints: [观察闭合线内侧标高变化以判断山顶, 相同比例尺与等高距下比较等高线疏密]
components: [TerrainScene, ContourMap, RouteProfile, EvidenceTable]
sources:
  - kind: simulation
    id: DS-SIM-TOPO-GQ
    title: GeoQuest 虚构山地高程模型
    attribution: GeoQuest
    method: 四个高斯山体叠加得到解析高程，121×91网格派生等高线，路线按241个等水平距离点计算
    parameters: [水平范围4×3km, 等高距50或100或200m, 垂直夸张仅作用于显示, 总爬升, 最大局部坡度]
    version: 2.0.0
    limitations: [不对应真实地点, 坡度为离散采样估计, 水平切片不表示洪水范围, 不含天气道路植被和地质灾害数据]
    review: { status: initial, notes: 来源与模型已由AI检查，结论见主题aiReview }
