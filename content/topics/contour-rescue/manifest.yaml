id: GQ-T006
slug: contour-rescue
title: 等高线山地救援
summary: 读取原创等高线地形，比较三条候选路线，为山地救援选择相对稳妥的路径。
coreQuestion: 只看等高线能判断哪些地形条件，还缺哪些信息才能选择相对安全的路线？
volume: G7A
chapter: 学会使用地图
prototype: geo-challenge
channels: [map-lab, geo-challenge, textbook-explorer]
competencies: [区域认知, 地理实践力]
status: 开发中
releaseBatch: Sprint 1
classroomMinutes: 12
explorationMinutes: 20
modes:
  exploration: { path: /topics/contour-rescue }
  classroom: { query: "?mode=classroom", sameContent: true }
primaryInteraction:
  object: 原创虚构等高线地形图
  action: 判读地形部位并比较三条同起终点候选路线
  feedback: 区分地形判读错误、计算错误与现有证据不足
evidenceOutput:
  type: 路线
  description: 地形标注、路线指标、选择依据和仍需补充的信息
  persistsFreeText: false
reflectionPrompt: 为什么等高线证据不能单独保证现实中的救援安全？
hints: [先找闭合等高线和鞍部, 等高线越密通常坡度越陡]
components: [GeoChallenge, CoordinatePicker, EvidencePanel]
sources:
