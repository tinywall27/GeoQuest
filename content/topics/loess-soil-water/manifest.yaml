id: GQ-T065
slug: loess-soil-water
title: 水土与流域
summary: 对照植被覆盖与坡面产流，追踪径流经滞蓄区到下游的过程，用水量账区分保土、削峰与暂存。
coreQuestion: 增加覆盖与流域滞蓄，分别怎样改变水土流失和下游流量？
volume: G8B
chapter: 水土保持与流域联系
prototype: simulator
channels: [earth-lab, region-explorer, geo-challenge]
competencies: [人地协调观, 地理实践力, 综合思维]
status: 已发布
releaseBatch: Sprint 3
classroomMinutes: 20
explorationMinutes: 20
modes:
  exploration: { path: /topics/loess-soil-water }
  classroom: { query: "?mode=classroom", sameContent: true }
primaryInteraction:
  object: 原创坡面产流与理想流域蓄水池
  action: 同雨型比较两种覆盖，再固定覆盖改变滞蓄空间并追踪雨后过程
  feedback: 坡面水量分配、相对侵蚀、入出流曲线和暂存水量同源更新
evidenceOutput:
  type: 情景结果
  description: 保存整场情景与时间序列，比较控制变量证据，可本地导出JSON
  persistsFreeText: false
reflectionPrompt: 为什么洪峰降低不等于水量消失，模型指数又为何不是实际泥沙量？
hints: [比较覆盖时保持雨型和滞蓄相同, 比较滞蓄时保持雨型和覆盖相同, 核对累计产流等于累计流出加暂存]
components: [BasinFigure, SlopeFigure, Hydrograph, WaterBudget, WaterEvidence]
