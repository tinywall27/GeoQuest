id: GQ-T065
slug: loess-soil-water
title: 一场暴雨带走多少黄土
summary: 改变降雨、坡度、植被和措施，观察原创相对侵蚀指数如何响应并比较治理情景。
coreQuestion: 同一场暴雨下，为什么有些坡地流失更多，又能怎样减缓？
volume: G8B
chapter: 黄土高原
prototype: simulator
channels: [earth-lab, region-explorer, geo-challenge]
competencies: [人地协调观, 地理实践力, 综合思维]
status: 开发中
releaseBatch: Sprint 5
classroomMinutes: 12
explorationMinutes: 20
modes:
  exploration: { path: /topics/loess-soil-water }
  classroom: { query: "?mode=classroom", sameContent: true }
primaryInteraction:
  object: 原创黄土坡面相对侵蚀模型
  action: 依次改变雨强、坡度、植被覆盖和耕作措施
  feedback: 显示相对径流、相对侵蚀及与基准的方向性差异
evidenceOutput:
  type: 情景结果
  description: 四组控制变量对比、一套保持方案和模型局限
  persistsFreeText: false
reflectionPrompt: 为什么相对侵蚀指数不能换算成真实泥沙量？
hints: [比较单一变量时锁定另外三项, 多变量组合只能评价方案而不能单因归因]
components: [ScenarioControls, Compare, EvidencePanel]
sources:
  - kind: reference
    id: DS-REFERENCE-RUSLE
    title: RUSLE 结构说明
    publisher: Food and Agriculture Organization of the United Nations
    attribution: Food and Agriculture Organization of the United Nations
    url: https://www.fao.org/land-water/land/land-governance/land-resources-planning-toolbox/category/details/fr/c/1236444/
    review: &sourceReview { status: unreviewed, notes: 仅作为模型结构参考 }
  - kind: simulation
    id: DS-MODEL-LOESS-V1
    title: GeoQuest 相对侵蚀教学模型
    attribution: GeoQuest
    method: 固定土壤可蚀性和坡长，对雨强坡度覆盖和措施使用离散相对因子
    parameters: [雨强, 坡度, 植被覆盖, 耕作措施]
    version: 0.1.0
    limitations: [只比较方向和相对指数, 不输出真实单位或预测实际泥沙量]
    review: *sourceReview
