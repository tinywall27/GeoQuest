  - kind: reference
    id: DS-DETENTION-EPA
    title: Stormwater Best Management Design Guide Volume 3
    publisher: U.S. Environmental Protection Agency
    attribution: EPA
    url: https://nepis.epa.gov/Exe/ZyPURL.cgi?Dockey=2000D1L8.TXT
    verifiedAt: "2026-09-17"
    review: *sourceReview
  - kind: simulation
    id: DS-SIM-WATERSHED-GQ
    title: GeoQuest 坡面产流与流域滞蓄概念模型
    attribution: GeoQuest 原创
    method: 限入渗能力分配降雨，逐时段守恒路由到有限容量线性蓄水池，相对侵蚀独立计算
    parameters: [面积1平方千米, 六段十分钟雨型, 覆盖20或80百分比, 滞蓄0或3000或12000立方米, 初始蓄水为0]
    version: 2.0.0
    limitations: [不是实测流域, 系数未经校准, 不模拟基流蒸发渗漏沉沙和河道传播, 侵蚀无量纲不能换算吨数, 峰值为十分钟平均]
    review: *sourceReview
