reflectionPrompt: 只降低补给至60万 m³，再用同一水账计算暗渠到水38；说明暗渠仍然可能无法满足50万 m³的需求。
hints:
  - 竖井用于施工维护，不等于每口井都抽水；暗渠省的是输送过程蒸发，不是创造补给，更不能保证永久有水。
