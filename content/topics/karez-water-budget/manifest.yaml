sources:
  - kind: simulation
    id: SIM-GQ-T063
    title: 坎儿井水账：省下的水从哪里来？原创教学模型
    attribution: GeoQuest 原创
    method: 虚构单期水账，留存目标20万 m³、取水上限80万
      m³；不动用历史储水。正落差时取水=min(80,max(0,补给−20))，无落差时取水0。暗渠/明渠蒸发率分别假设5%/20%，其余输送损失忽略。
    parameters:
      - 本期地下水补给（万 m³）
      - 输水方式（教学假设蒸发率）
      - 入口至出口落差（不设水泵）
    version: 1.0.0
    limitations:
      - 百分比为教学对照，不是新疆或任何真实坎儿井实测值；原理参考亦不提供这些数值。
      - 实际出水受地下水位、渗透性、隧道坡度及多年储量变化影响，本模型不计算流速或工程施工参数。
      - 明渠对照只是相同取水量的无遮盖输水情境；图中地表随遮盖状态改变，仅用于区分暗渠与露天渠，不能据此推导施工成本。
      - 完成的是开发者模拟试讲走读，尚未真实课堂试教，不能宣称提升学习成效。
    review:
      status: initial
