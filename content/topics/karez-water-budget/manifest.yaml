id: GQ-T063
slug: karez-water-budget
title: 坎儿井水账：省下的水从哪里来？
summary: 用自流剖面说明水沿落差流动，在相同补给下比较明暗渠到水量，并用守恒解释暗渠不能凭空增水。
coreQuestion: 暗渠减少蒸发，是否意味着没有补给也能一直出水？
