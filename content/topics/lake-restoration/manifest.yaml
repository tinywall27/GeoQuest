id: GQ-T041
slug: lake-restoration
title: 洞庭湖如何重获呼吸
summary: 比较两个时期的同季节遥感合成影像，只对可见水面变化作出有边界的解释。
coreQuestion: 洞庭湖的水面、水质、生产活动和治理措施之间发生了怎样的连锁变化，哪些变化还不能只凭影像归因？
volume: G8A
chapter: 中国的自然环境
prototype: image-explorer
channels: [map-lab, data-lab, region-explorer]
competencies: [地理实践力, 人地协调观]
status: 开发中
releaseBatch: Sprint 4
classroomMinutes: 12
explorationMinutes: 20
modes:
  exploration: { path: /topics/lake-restoration }
  classroom: { query: "?mode=classroom", sameContent: true }
primaryInteraction:
  object: 同范围同季节的两期洞庭湖遥感合成
  action: 拖动分割线并标注三个预设变化热点
  feedback: 区分影像直接支持、官方监测支持和只能提出假设
evidenceOutput:
  type: 标注
  description: 三处热点、一条问题—措施—成效链、替代解释和置信度
  persistsFreeText: false
reflectionPrompt: 为什么水面或颜色变化不能直接证明水质改善和治理因果？
hints: [先核对日期季节和有效像元, 把影像观察与官方监测分开]
components: [ImageSwipe, AnnotationLayer, EvidencePanel]
