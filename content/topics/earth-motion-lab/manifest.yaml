id: GQ-T003
slug: earth-motion-lab
title: 地球与太阳
summary: 跟随地表观测点经历昼夜，比较南北半球日照，用同纬度与零倾角实验探究四季。
coreQuestion: 自转怎样造成昼夜交替，地轴倾斜与公转怎样改变季节日照？
volume: G7A
chapter: 地球的运动
prototype: simulator
channels: [earth-lab, textbook-explorer]
competencies: [综合思维, 地理实践力]
status: 已发布
releaseBatch: Sprint 2
classroomMinutes: 20
explorationMinutes: 20
modes:
  exploration: { path: /topics/earth-motion-lab }
  classroom: { query: "?mode=classroom", sameContent: true }
primaryInteraction:
  object: 地轴、太阳光与地表观测点共享几何的三维地球
  action: 分开控制一天时刻与公转位置，比较23.4度和0度地轴倾角
  feedback: 地表点、昼夜光照、太阳高度、南北昼长与轨道位置同步变化
evidenceOutput:
  type: 情景结果
  description: 记录昼夜时刻和同纬度至日对照，可本地导出结构化JSON
  persistsFreeText: false
reflectionPrompt: 模型距离不变时为何仍有日照季节差异，日照变化是否等于天气变化？
hints: [先记录白昼与黑夜各一次, 保持纬度与倾角不变比较两次至日, 同纬度补齐零倾角对照]
components: [EarthScene, OrbitDiagram, SolarPath, DaylightBar, EarthEvidence]
sources:
  - kind: reference
    id: DS-SPACE-NASA
    title: NASA Facts About Earth
    publisher: National Aeronautics and Space Administration
    attribution: NASA
    url: https://science.nasa.gov/earth/facts/
    verifiedAt: "2026-09-17"
    review: &sourceReview { status: initial, notes: AI核对事实和公式，不复用图片，见主题审查记录 }
  - kind: reference
    id: DS-SEASONS-NASA
    title: What Causes the Seasons
    publisher: NASA Space Place
    attribution: NASA
    url: https://spaceplace.nasa.gov/seasons/en/
    verifiedAt: "2026-09-17"
    review: *sourceReview
  - kind: reference
    id: DS-SOLAR-NOAA
    title: General Solar Position Calculations
    publisher: NOAA Global Monitoring Laboratory
    attribution: NOAA
    url: https://gml.noaa.gov/grad/solcalc/solareqns.PDF
    verifiedAt: "2026-09-17"
    review: *sourceReview
  - kind: simulation
    id: DS-SIM-EARTH-GQ
    title: GeoQuest 地球与太阳球面几何模型
    attribution: GeoQuest 原创
    method: 固定地轴向量和圆轨道太阳方向，球面点积共同决定受光状态、太阳高度与理论昼长
    parameters: [公转角0至360度, 地轴倾角23.4或0度, 地方太阳时0至24小时, 南北对照纬度0至80度]
    version: 2.0.0
    limitations: [天体大小距离速度不按比例, 固定日地距离的圆轨道, 无大气折射太阳视半径地形与气温模拟, 不处理极点分日情形]
    review: *sourceReview
