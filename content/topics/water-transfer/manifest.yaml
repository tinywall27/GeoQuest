sources:
  - kind: simulation
    id: SIM-GQ-T044
    title: 跨流域调水：能调多少水？原创教学模型
    attribution: GeoQuest 原创
    method: 虚构单期水账，无蓄水跨期调节。实际调出=min(申请量,max(0,来水−生态留水底线))；到水=调出×90%。固定受水区需求50万
      m³。原流域留水+途中损耗+到水=来水。
    parameters:
      - 调出区本期来水（万 m³）
      - 原流域生态留水底线（万 m³）
      - 申请调出量（万 m³）
    version: 1.0.0
    limitations:
      - 10%为教学假设，不代表任何真实调水工程的损耗率；途中损耗指未到受水区，并非水从自然界消失。
      - 不评价真实线路、工程成本、水质、移民与跨期生态影响；生态底线也不是现实审批标准。
      - 开发者模拟走读已完成，真实试教与教师对答案、课时的审核尚未进行。
    review:
      status: initial
