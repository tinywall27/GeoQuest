id: GQ-T044
slug: water-transfer
title: 跨流域调水：能调多少水？
summary: 独立用同一期水量守恒计算可调量、输水损耗和受水区缺口，解释生态约束为何限制调水。
coreQuestion: 调出区必须留足生态用水，输水又有损耗，申请的水一定能够送到吗？
volume: G8A
chapter: 中国的自然资源
prototype: simulator
