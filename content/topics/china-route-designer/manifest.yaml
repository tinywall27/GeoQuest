id: GQ-T049
slug: china-route-designer
title: 运输方案：便宜也要能按时送到
summary: 用载量与时限筛选方案，再比较可行方案费用，能解释没有可行方案的情况。
coreQuestion: 最低费用方案为什么可能不能交付这批货物？
volume: G8A
chapter: 交通运输
prototype: decision-lab
channels:
